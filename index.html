<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>數位永續 薪在嘉義 - 廠商面試管理系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans TC', sans-serif; }
  body { background-color: #121132; color: #FFFFFF; min-height: 100vh; }
  
  .form-container { 
    background: linear-gradient(135deg, rgba(31, 29, 83, 0.95) 0%, rgba(76, 35, 124, 0.85) 100%); 
    border-radius: 24px; 
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5); 
    border: 2px solid #28C4FF; 
  }
  .submit-btn { 
    background: linear-gradient(135deg, #AC3FFF, #6A1BCB); 
    border-radius: 12px; 
    color: #FFFFFF; 
    font-weight: 700; 
  }
  select, input[type="password"] { 
    background-color: rgba(31, 29, 83, 0.9) !important; 
    border: 2px solid #A48DCD !important; 
    color: #FFFFFF !important; 
  }
  select option { background-color: #1F1D53; color: #FFFFFF; }
  .hidden { display: none !important; }
  .spinner { border: 4px solid rgba(255, 255, 255, 0.3); border-radius: 50%; border-top-color: #28C4FF; width: 2.25rem; height: 2.25rem; animation: spin 1s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .modal-backdrop {
    background-color: rgba(10, 9, 28, 0.85);
    backdrop-filter: blur(5px);
  }
  /* 卡片樣式 1：等候中 (高亮白底) */
  .candidate-card-pending {
    background-color: #FFFFFF;
    color: #0F172A;
    border: 2px solid #38BDF8;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
  }
  .candidate-card-pending:hover, .candidate-card-pending:active {
    border-color: #FACC15;
    transform: translateY(-2px);
  }
  /* 卡片樣式 2：面試中 (淺橘底) */
  .candidate-card-interviewing {
    background-color: #FFF7ED;
    color: #9A3412;
    border: 2px solid #FB923C;
    box-shadow: 0 0 12px rgba(251, 146, 60, 0.35);
  }
  /* 卡片樣式 3：已完成面試 (灰底靜音狀態) */
  .candidate-card-completed {
    background-color: #E2E8F0;
    color: #475569;
    border: 2px solid #94A3B8;
    opacity: 0.9;
  }
</style>
</head>
<body class="min-h-screen flex flex-col justify-between">
<!-- ==================== 1. 廠商身分驗證登入畫面 ==================== -->
<div id="loginSection" class="flex-1 flex items-center justify-center p-4 sm:p-6 lg:p-12">
  <div class="form-container p-6 sm:p-10 md:p-12 max-w-xl w-full text-center space-y-6">
    <div class="space-y-2 border-b border-purple-400/20 pb-5">
      <div class="text-lg sm:text-xl font-bold text-cyan-300 tracking-wider">數位永續 薪在嘉義</div>
      <div class="text-2xl sm:text-3xl font-extrabold text-white tracking-wide">嘉義就業中心</div>
      <div class="text-2xl sm:text-3xl font-black text-amber-300 pt-1">廠商面試管理系統</div>
    </div>
    <div id="authBox" class="space-y-5 pt-2">
      <div class="text-left space-y-2">
        <label for="companySelect" class="text-lg font-bold text-purple-200 block">請選擇公司名稱</label>
        <select id="companySelect" class="w-full px-4 py-3 text-lg font-bold rounded-xl border-2 border-cyan-400 focus:outline-none focus:border-amber-300 transition">
          <option value="" disabled selected>載入廠商清單中...</option>
        </select>
      </div>
      <div class="text-left space-y-2">
        <label for="pinInput" class="text-lg font-bold text-purple-200 block">請輸入 8 位數密碼</label>
        <input 
          type="password" 
          id="pinInput" 
          maxlength="8" 
          placeholder="請輸入 8 位數密碼" 
          onkeypress="handleKeyPress(event)"
          class="w-full text-center text-2xl tracking-widest py-3 font-bold rounded-xl border-2 border-cyan-400 focus:outline-none focus:border-amber-300 transition">
      </div>
      <button onclick="submitPinAuth()" id="loginBtn" class="submit-btn w-full py-4 text-xl font-bold shadow-xl hover:opacity-95 transition mt-3">
        進入面試管理清單
      </button>
    </div>
    <div id="loadingBox" class="hidden py-8 space-y-4">
      <span class="spinner"></span>
      <p id="loadingStatusText" class="text-xl font-bold text-cyan-300">正在驗證密碼並載入面試名單...</p>
    </div>
  </div>
</div>

<!-- ==================== 2. 廠商專屬面試名單主畫面 ==================== -->
<div id="appSection" class="hidden flex-1 flex flex-col p-3 sm:p-6 lg:p-8 max-w-4xl mx-auto w-full">
  
  <!-- 頂部資訊列 -->
  <div class="bg-slate-900/95 border-2 border-cyan-400 rounded-2xl p-4 sm:p-5 shadow-2xl mb-4 space-y-3">
    <div class="flex items-start justify-between gap-3">
      <div>
        <div class="flex items-center gap-2 mb-1">
          <span id="candidateCountBadge" class="text-xs sm:text-sm font-bold text-cyan-300 bg-slate-800 px-2 py-0.5 rounded border border-cyan-400/30">應徵總數：0 人</span>
        </div>
        <h1 id="currentCompanyName" class="text-xl sm:text-2xl font-black text-white tracking-wide">--</h1>
      </div>
      <button onclick="logout()" class="px-3.5 py-1.5 bg-red-600/90 hover:bg-red-500 font-bold rounded-lg text-white transition text-xs sm:text-sm shadow whitespace-nowrap">
        登出
      </button>
    </div>
    
    <div class="flex items-center justify-between text-xs sm:text-sm text-cyan-200 font-medium pt-2 border-t border-slate-800 flex-wrap gap-2">
      <span id="syncNotice">💡 每 5 秒自動同步進度。</span>
      <div class="flex items-center gap-3">
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 bg-orange-500 rounded-full inline-block"></span> 橘色為他人面試中</span>
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 bg-slate-400 rounded-full inline-block"></span> 灰底為已面試</span>
      </div>
    </div>
  </div>

  <!-- 卡片式求職者清單 -->
  <div id="candidateCardsContainer" class="space-y-3 pb-8"></div>
</div>

<!-- ==================== 3. 完整網頁履歷檢視與回填 Modal ==================== -->
<div id="resumeModal" class="hidden fixed inset-0 z-50 modal-backdrop flex items-center justify-center p-3 sm:p-6 overflow-y-auto">
  <div class="bg-slate-900 border-2 border-cyan-400 rounded-2xl max-w-3xl w-full max-h-[92vh] flex flex-col shadow-2xl overflow-hidden text-white my-auto">
    
    <!-- Modal 頂部標題列 (右上角 X 關閉並觸發確認警告) -->
    <div class="bg-gradient-to-r from-purple-900 to-indigo-900 px-5 py-4 flex items-center justify-between border-b border-cyan-400/40">
      <div class="flex items-center gap-3">
        <span class="text-2xl sm:text-3xl font-black text-amber-300 tracking-wide" id="modalCandidateName">求職者姓名</span>
        <span class="text-sm sm:text-base bg-cyan-600 px-3 py-1 rounded-full font-bold shadow-sm" id="modalJobTitle">應徵職務</span>
      </div>
      <button onclick="handleCloseClick()" class="text-gray-300 hover:text-amber-400 text-4xl font-black leading-none p-1 transition" title="關閉履歷">&times;</button>
    </div>

    <!-- Modal 內部資料主體 -->
    <div class="p-4 sm:p-6 space-y-6 overflow-y-auto flex-1 text-slate-100" id="modalResumeBody">
      
      <!-- 📋 基本資料區塊（含生理性別、民國出生日與動態經歷欄位併入） -->
      <div class="bg-slate-800/95 rounded-xl p-4 sm:p-6 border border-purple-400/40 space-y-4">
        <h3 class="text-lg sm:text-xl font-black text-cyan-300 border-b border-slate-700 pb-2">📋 基本資料</h3>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-base sm:text-lg">
          <div>
            <span class="text-gray-300 font-medium">身分證末3碼：</span>
            <span id="m_idNo" class="font-extrabold text-amber-300 font-mono text-xl sm:text-2xl">--</span>
          </div>
          <div>
            <span class="text-gray-300 font-medium">生理性別：</span>
            <span id="m_gender" class="font-extrabold text-cyan-300 text-lg sm:text-xl">--</span>
          </div>
          <div>
            <span class="text-gray-300 font-medium">出生日期：</span>
            <span id="m_birthday" class="font-bold text-white">--</span>
          </div>
          <div>
            <span class="text-gray-300 font-medium">聯絡電話：</span>
            <span id="m_phone" class="font-bold text-white">--</span>
          </div>
          <div class="col-span-1 sm:col-span-2">
            <span class="text-gray-300 font-medium">電子信箱：</span>
            <span id="m_email" class="font-bold text-white break-all">--</span>
          </div>
          <div class="col-span-1 sm:col-span-2">
            <span class="text-gray-300 font-medium">通訊地址：</span>
            <span id="m_address" class="font-bold text-white leading-relaxed">--</span>
          </div>
        </div>

        <!-- 併入基本資料內部的履歷其餘欄位（畢業學校/科系、工作經歷、自薦等，排除身分證與最高學歷） -->
        <div id="dynamicFieldsContainer" class="pt-3 border-t border-slate-700/80 space-y-4"></div>
      </div>

      <!-- 📝 廠商面試評核回填區塊 -->
      <div class="bg-indigo-950/90 rounded-xl p-4 sm:p-6 border-2 border-amber-300 space-y-4 shadow-xl">
        <div class="flex items-center justify-between border-b border-indigo-800 pb-2">
          <h3 class="text-lg sm:text-xl font-black text-amber-300">📝 廠商面試紀錄填寫</h3>
          <span class="text-sm text-amber-200 font-bold">⚠️ 錄取結果為必選項目</span>
        </div>
        
        <!-- 錄取結果核取選單 (二選一互斥防呆) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
          <label class="flex items-center gap-3.5 bg-slate-900/90 p-4 rounded-xl border-2 border-green-500/60 hover:border-green-400 cursor-pointer transition select-none">
            <input 
              type="checkbox" 
              id="modalIsAccepted" 
              onchange="handleDecisionChange('accept')" 
              class="w-6 h-6 text-green-500 rounded focus:ring-2 focus:ring-green-400 cursor-pointer">
            <span class="text-base sm:text-lg font-black text-green-300">
              ⭐ 擬錄取此求職者
            </span>
          </label>
          <label class="flex items-center gap-3.5 bg-slate-900/90 p-4 rounded-xl border-2 border-rose-500/60 hover:border-rose-400 cursor-pointer transition select-none">
            <input 
              type="checkbox" 
              id="modalIsRejected" 
              onchange="handleDecisionChange('reject')" 
              class="w-6 h-6 text-rose-500 rounded focus:ring-2 focus:ring-rose-400 cursor-pointer">
            <span class="text-base sm:text-lg font-black text-rose-300">
              ❌ 不錄取
            </span>
          </label>
        </div>

        <!-- 面試紀錄輸入框 -->
        <div class="space-y-2 pt-1">
          <label for="modalInterviewNotes" class="text-base sm:text-lg font-bold text-purple-200 block">
            面試紀錄：
          </label>
          <textarea 
            id="modalInterviewNotes" 
            rows="3" 
            placeholder="請輸入面試情形、專業能力評估、期望待遇協商等紀錄..." 
            class="w-full bg-slate-900 border-2 border-purple-400/60 rounded-xl p-3.5 text-white font-medium focus:outline-none focus:border-amber-300 transition text-base leading-relaxed"></textarea>
        </div>
      </div>
    </div>

    <!-- Modal 底部按鈕列 -->
    <div class="bg-slate-950 px-5 py-4 flex items-center justify-end border-t border-slate-800">
      <button onclick="submitEvaluation()" id="saveEvalBtn" class="w-full sm:w-auto px-10 py-3 bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-300 hover:to-amber-400 text-slate-950 font-black rounded-xl text-base sm:text-lg shadow-xl transition">
        儲存面試資料
      </button>
    </div>
  </div>
</div>

<script>
// ⚠️ 請填入您的 Apps Script Web App 部署網址
const SCRIPT_API_URL = 'https://script.google.com/macros/s/AKfycbxJudcf8iSdz6puCsjYpDmSdCvnaeUtJWyzd0Zu8Z8jAH55hNiTiWLE1NK-So_EtpE4/exec';
let currentCompany = '';
let currentPin = '';
let currentCandidates = [];
let activeCandidate = null;
let pollTimer = null;

document.addEventListener('DOMContentLoaded', () => {
  loadCompanyList();
});

function loadCompanyList() {
  const selectElem = document.getElementById('companySelect');
  const callbackName = 'cb_getCompanyList_' + Date.now();
  window[callbackName] = function(res) {
    if (res && res.success && Array.isArray(res.companyList)) {
      selectElem.innerHTML = '<option value="" disabled selected>-- 請選擇公司名稱 --</option>';
      res.companyList.forEach(compName => {
        const option = document.createElement('option');
        option.value = compName;
        option.textContent = compName;
        selectElem.appendChild(option);
      });
      const urlParams = new URLSearchParams(window.location.search);
      const companyParam = urlParams.get('company') ? decodeURIComponent(urlParams.get('company')).trim() : '';
      if (companyParam) {
        for (let i = 0; i < selectElem.options.length; i++) {
          if (selectElem.options[i].value.includes(companyParam) || companyParam.includes(selectElem.options[i].value)) {
            selectElem.selectedIndex = i;
            break;
          }
        }
      }
    }
    delete window[callbackName];
    const scriptEl = document.getElementById(callbackName);
    if (scriptEl) scriptEl.remove();
  };
  const script = document.createElement('script');
  script.id = callbackName;
  script.src = `${SCRIPT_API_URL}?action=getCompanyList&callback=${callbackName}`;
  document.body.appendChild(script);
}

function handleKeyPress(event) {
  if (event.key === 'Enter' || event.keyCode === 13) {
    event.preventDefault();
    submitPinAuth();
  }
}

function submitPinAuth() {
  const selectElem = document.getElementById('companySelect');
  const selectedCompany = selectElem.value;
  const pinInput = document.getElementById('pinInput').value.trim();
  if (!selectedCompany || pinInput.length !== 8) {
    alert('請選擇公司並輸入完整的 8 位數密碼！');
    return;
  }
  const authBox = document.getElementById('authBox');
  const loadingBox = document.getElementById('loadingBox');
  authBox.classList.add('hidden');
  loadingBox.classList.remove('hidden');

  fetchCandidateList(selectedCompany, pinInput, (res) => {
    if (res && res.success) {
      currentCompany = selectedCompany;
      currentPin = pinInput;
      currentCandidates = res.candidates || [];
      
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('appSection').classList.remove('hidden');
      document.getElementById('currentCompanyName').textContent = currentCompany;
      renderCandidateCards();
      startPolling();
    } else {
      alert(res.message || '🔒 密碼錯誤！請輸入 8 位數密碼。');
      authBox.classList.remove('hidden');
      loadingBox.classList.add('hidden');
    }
  });
}

function fetchCandidateList(comp, pin, callback) {
  const callbackName = 'cb_fetch_' + Date.now();
  let isHandled = false;
  const timeoutTimer = setTimeout(() => {
    if (!isHandled) {
      isHandled = true;
      delete window[callbackName];
      const el = document.getElementById(callbackName);
      if (el) el.remove();
      if (callback) callback(null);
    }
  }, 8000);

  window[callbackName] = function(res) {
    if (isHandled) return;
    isHandled = true;
    clearTimeout(timeoutTimer);
    if (callback) callback(res);
    delete window[callbackName];
    const scriptEl = document.getElementById(callbackName);
    if (scriptEl) scriptEl.remove();
  };

  const script = document.createElement('script');
  script.id = callbackName;
  script.src = `${SCRIPT_API_URL}?action=loginAndFetchList&company=${encodeURIComponent(comp)}&pin=${encodeURIComponent(pin)}&callback=${callbackName}`;
  
  script.onerror = function() {
    if (isHandled) return;
    isHandled = true;
    clearTimeout(timeoutTimer);
    if (callback) callback(null);
    delete window[callbackName];
    script.remove();
  };
  document.body.appendChild(script);
}

function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(() => {
    if (!activeCandidate && currentCompany && currentPin) {
      fetchCandidateList(currentCompany, currentPin, (res) => {
        if (res && res.success) {
          currentCandidates = res.candidates || [];
          renderCandidateCards();
        }
      });
    }
  }, 4000);
}

/**
 * 渲染卡片：包含「擬錄取」與「不錄取」標籤呈現
 */
function renderCandidateCards() {
  const container = document.getElementById('candidateCardsContainer');
  container.innerHTML = '';
  document.getElementById('candidateCountBadge').textContent = `應徵總數：${currentCandidates.length} 人`;
  if (currentCandidates.length === 0) {
    container.innerHTML = `
      <div class="bg-slate-900/80 border border-slate-700 rounded-2xl py-12 text-center text-gray-400 font-bold">
        目前尚無預約或報到的求職者名單
      </div>
    `;
    return;
  }

  currentCandidates.forEach((cand) => {
    const rawNotes = (cand.interviewNotes || '').trim();
    const rawDecision = (cand.rawDecision || '').trim();
    
    const isCompleted = cand.isAccepted || rawDecision === '不錄取' || (rawNotes !== '' && rawNotes !== '面試中');
    const isInterviewing = !isCompleted && rawNotes === '面試中';
    
    const id3Digits = cand.idNo && cand.idNo.length >= 3 
      ? cand.idNo.substring(cand.idNo.length - 3) 
      : (cand.idNo || '--');

    let cardClass = '';
    let statusBadge = '';
    if (isCompleted) {
      cardClass = 'candidate-card-completed cursor-pointer';
      statusBadge = '<span class="px-2.5 py-1 bg-slate-400 text-slate-900 text-xs font-black rounded-lg">已完成面試</span>';
    } else if (isInterviewing) {
      cardClass = 'candidate-card-interviewing cursor-pointer';
      statusBadge = '<span class="px-2.5 py-1 bg-orange-500 text-white text-xs font-black rounded-lg animate-pulse shadow">⚠️ 他人面試中</span>';
    } else {
      cardClass = 'candidate-card-pending cursor-pointer';
      statusBadge = '<span class="px-2.5 py-1 bg-amber-100 text-amber-800 text-xs font-black rounded-lg border border-amber-300">等候面試中</span>';
    }

    let decisionBadge = '';
    if (cand.isAccepted || rawDecision === '擬錄取') {
      decisionBadge = '<span class="px-2.5 py-1 bg-green-600 text-white text-xs font-black rounded-lg shadow-sm">✓ 擬錄取</span>';
    } else if (rawDecision === '不錄取' || isCompleted) {
      decisionBadge = '<span class="px-2.5 py-1 bg-rose-600 text-white text-xs font-black rounded-lg shadow-sm">✗ 不錄取</span>';
    }

    const card = document.createElement('div');
    card.className = `${cardClass} rounded-2xl p-4 transition duration-200 flex items-center justify-between gap-3`;
    
    card.onclick = () => {
      handleCandidateClick(cand);
    };

    card.innerHTML = `
      <div class="flex-1 min-w-0 space-y-1">
        <div class="flex items-center gap-2.5 flex-wrap">
          <span class="text-xl sm:text-2xl font-black ${isCompleted ? 'text-slate-800' : (isInterviewing ? 'text-orange-950' : 'text-blue-900')} tracking-wide">
            ${cand.name}
          </span>
          <span class="font-mono text-xs font-bold px-2 py-0.5 rounded ${isCompleted ? 'bg-slate-300 text-slate-700' : 'bg-slate-100 text-slate-600 border border-slate-300'}">
            末3碼：${id3Digits}
          </span>
        </div>
        <div class="text-sm sm:text-base font-extrabold ${isCompleted ? 'text-slate-600' : 'text-slate-700'} truncate">
          ${cand.jobTitle}
        </div>
      </div>
      <div class="flex flex-col sm:flex-row items-end sm:items-center gap-2 flex-shrink-0">
        <div class="flex items-center gap-1.5 flex-wrap justify-end">
          ${decisionBadge}
          ${statusBadge}
        </div>
      </div>
    `;
    container.appendChild(card);
  });
}

/**
 * 處理卡片點擊
 */
function handleCandidateClick(cand) {
  const currentCandidateInList = currentCandidates.find(c => c.idNo === cand.idNo) || cand;
  const rawNotes = (currentCandidateInList.interviewNotes || '').trim();
  const rawDecision = (currentCandidateInList.rawDecision || '').trim();
  const isCompleted = currentCandidateInList.isAccepted || rawDecision === '不錄取' || (rawNotes !== '' && rawNotes !== '面試中');
  const isInterviewing = !isCompleted && rawNotes === '面試中';

  if (isInterviewing) {
    if (!confirm(`⚠️ 提示：此求職者【${currentCandidateInList.name}】目前另一位面試官顯示「面試中」，確定要同時開啟檢視嗎？`)) {
      return;
    }
  }
  openResumeModal(currentCandidateInList);
}

/**
 * 處理「擬錄取」與「不錄取」的互斥防呆
 */
function handleDecisionChange(type) {
  const acceptBox = document.getElementById('modalIsAccepted');
  const rejectBox = document.getElementById('modalIsRejected');
  if (type === 'accept' && acceptBox.checked) {
    rejectBox.checked = false;
  } else if (type === 'reject' && rejectBox.checked) {
    acceptBox.checked = false;
  }
}

/**
 * 身分證字號判斷生理性別
 */
function getGenderById(id) {
  if (!id || typeof id !== 'string') return '--';
  const clean = id.replace(/\s+/g, '').toUpperCase();
  if (clean.length < 2) return '--';
  const secondChar = clean.charAt(1);
  if (secondChar === '1' || secondChar === '8' || secondChar === 'A' || secondChar === 'C') {
    return '男';
  } else if (secondChar === '2' || secondChar === '9' || secondChar === 'B' || secondChar === 'D') {
    return '女';
  }
  return '--';
}

/**
 * 出生日期轉民國格式 (例: 1987-10-06 轉為 民國 76 年 10 月 06 日)
 */
function formatRocDate(dateStr) {
  if (!dateStr || typeof dateStr !== 'string') return '--';
  const str = dateStr.trim();
  if (!str) return '--';

  const match = str.match(/^(\d{4})[-\/年](\d{1,2})[-\/月](\d{1,2})日?$/);
  if (match) {
    const year = parseInt(match[1], 10);
    const month = String(match[2]).padStart(2, '0');
    const day = String(match[3]).padStart(2, '0');
    if (year >= 1912) {
      return `民國 ${year - 1911} 年 ${month} 月 ${day} 日`;
    }
  }
  return str;
}

/**
 * 開啟履歷
 */
function openResumeModal(cand) {
  activeCandidate = cand;
  document.getElementById('modalCandidateName').textContent = cand.name;
  document.getElementById('modalJobTitle').textContent = cand.jobTitle;
  
  const rawNotes = (cand.interviewNotes || '').trim();
  const rawDecision = (cand.rawDecision || '').trim();
  const isCompleted = cand.isAccepted || rawDecision === '不錄取' || (rawNotes !== '' && rawNotes !== '面試中');

  // 初始化勾選狀態
  if (cand.isAccepted || rawDecision === '擬錄取') {
    document.getElementById('modalIsAccepted').checked = true;
    document.getElementById('modalIsRejected').checked = false;
  } else if (rawDecision === '不錄取' || isCompleted) {
    document.getElementById('modalIsAccepted').checked = false;
    document.getElementById('modalIsRejected').checked = true;
  } else {
    document.getElementById('modalIsAccepted').checked = false;
    document.getElementById('modalIsRejected').checked = false;
  }

  document.getElementById('modalInterviewNotes').value = (rawNotes === '面試中') ? '' : rawNotes;
  
  // 身分證末3碼與生理性別
  const id3Digits = cand.idNo && cand.idNo.length >= 3 ? cand.idNo.substring(cand.idNo.length - 3) : (cand.idNo || '--');
  document.getElementById('m_idNo').textContent = id3Digits;
  document.getElementById('m_gender').textContent = getGenderById(cand.idNo);

  document.getElementById('m_birthday').textContent = '讀取中...';
  document.getElementById('m_phone').textContent = '讀取中...';
  document.getElementById('m_email').textContent = '讀取中...';
  document.getElementById('m_address').textContent = '讀取中...';
  document.getElementById('dynamicFieldsContainer').innerHTML = '<div class="py-4 text-center text-cyan-300 font-bold text-base"><span class="spinner"></span> 正在載入完整履歷資料...</div>';
  document.getElementById('resumeModal').classList.remove('hidden');

  setCandidateStatus(cand.idNo, '面試中');

  const callbackName = 'cb_getResume_' + Date.now();
  window[callbackName] = function(res) {
    if (res && res.success && res.resume) {
      renderResumeDetails(res.resume, cand.idNo);
    } else {
      document.getElementById('dynamicFieldsContainer').innerHTML = '<p class="text-amber-400 font-bold text-center py-4 text-base">⚠️ 求職登記表中未找到該求職者之詳細履歷資料</p>';
    }
    delete window[callbackName];
    const scriptEl = document.getElementById(callbackName);
    if (scriptEl) scriptEl.remove();
  };
  const script = document.createElement('script');
  script.id = callbackName;
  script.src = `${SCRIPT_API_URL}?action=getResumeDetail&idNo=${encodeURIComponent(cand.idNo)}&callback=${callbackName}`;
  document.body.appendChild(script);
}

/**
 * 渲染履歷細項 (排除最高學歷與身分證等不需重複展示的欄位)
 */
function renderResumeDetails(r, rawIdNo) {
  document.getElementById('m_birthday').textContent = formatRocDate(r['出生日期']);
  document.getElementById('m_phone').textContent = r['聯絡電話'] || '--';
  document.getElementById('m_email').textContent = r['E-mail'] || '--';
  document.getElementById('m_address').textContent = r['聯絡地址'] || '--';
  
  const fullId = r['身分證字號(居留證號)'] || r['身分證字號'] || rawIdNo;
  document.getElementById('m_gender').textContent = getGenderById(fullId);

  const container = document.getElementById('dynamicFieldsContainer');
  container.innerHTML = '';
  
  const ignoredKeys = [
    '時間戳記', '機構運用', '活動資訊來源', '姓名', '出生日期', 
    '身分證', '居留證', '身分證字號', '身分證字號(居留證號)', 
    '婚姻狀況', '兵役狀況', '聯絡地址', '聯絡電話', 'E-mail', 
    '最高學歷', '生理性別', '性別'
  ];

  let extraHtml = '';
  for (let key in r) {
    if (!ignoredKeys.some(ik => key.includes(ik)) && r[key]) {
      extraHtml += `
        <div class="pt-1">
          <span class="text-amber-300 font-extrabold text-base sm:text-lg block mb-1">【${key}】：</span>
          <div class="bg-slate-900/90 p-4 rounded-xl text-gray-100 whitespace-pre-wrap font-medium text-base sm:text-lg leading-relaxed border border-slate-700/60">${r[key]}</div>
        </div>
      `;
    }
  }

  if (extraHtml) {
    container.innerHTML = extraHtml;
  } else {
    container.innerHTML = '';
  }
}

function setCandidateStatus(idNo, status) {
  const script = document.createElement('script');
  script.src = `${SCRIPT_API_URL}?action=setInterviewStatus&company=${encodeURIComponent(currentCompany)}&idNo=${encodeURIComponent(idNo)}&status=${encodeURIComponent(status)}`;
  document.body.appendChild(script);
}

/**
 * 儲存面試資料
 */
function submitEvaluation() {
  if (!activeCandidate) return;
  const isAccepted = document.getElementById('modalIsAccepted').checked;
  const isRejected = document.getElementById('modalIsRejected').checked;

  if (!isAccepted && !isRejected) {
    alert('⚠️ 請選擇面試結果：「擬錄取」或「不錄取」，至少需勾選一項才能儲存！');
    return;
  }

  const notes = document.getElementById('modalInterviewNotes').value.trim();
  const btn = document.getElementById('saveEvalBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner !w-4 !h-4 border-2"></span> 正在儲存...';

  const callbackName = 'cb_saveEval_' + Date.now();
  window[callbackName] = function(res) {
    btn.disabled = false;
    btn.innerHTML = '儲存面試資料';
    if (res && res.success) {
      alert('✅ 面試紀錄已成功儲存！');
      activeCandidate.isAccepted = isAccepted;
      activeCandidate.rawDecision = isAccepted ? '擬錄取' : '不錄取';
      activeCandidate.interviewNotes = notes;
      
      renderCandidateCards();
      document.getElementById('resumeModal').classList.add('hidden');
      activeCandidate = null;
    } else {
      alert('❌ 儲存失敗：' + (res.message || '未知錯誤'));
    }
    delete window[callbackName];
    const scriptEl = document.getElementById(callbackName);
    if (scriptEl) scriptEl.remove();
  };

  const script = document.createElement('script');
  script.id = callbackName;
  script.src = `${SCRIPT_API_URL}?action=saveInterviewResult&company=${encodeURIComponent(currentCompany)}&idNo=${encodeURIComponent(activeCandidate.idNo)}&isAccepted=${isAccepted}&notes=${encodeURIComponent(notes)}&callback=${callbackName}`;
  document.body.appendChild(script);
}

/**
 * 點選右上角 X 關閉履歷時跳出警示詢問
 */
function handleCloseClick() {
  if (confirm('您確定要關閉此求職者履歷嗎？\n（尚未點選「儲存面試資料」的紀錄將不會被保留）')) {
    closeModal();
  }
}

/**
 * 關閉 Modal 並將狀態釋放回「等候中」
 */
function closeModal() {
  if (activeCandidate) {
    const rawNotes = (activeCandidate.interviewNotes || '').trim();
    if (!rawNotes || rawNotes === '面試中') {
      setCandidateStatus(activeCandidate.idNo, '等候中');
      activeCandidate.interviewNotes = '';
    }
  }
  document.getElementById('resumeModal').classList.add('hidden');
  activeCandidate = null;
  renderCandidateCards();
}

function logout() {
  if (confirm('確定要登出廠商系統嗎？')) {
    if (pollTimer) clearInterval(pollTimer);
    currentCompany = '';
    currentPin = '';
    currentCandidates = [];
    document.getElementById('pinInput').value = '';
    document.getElementById('appSection').classList.add('hidden');
    document.getElementById('loginSection').classList.remove('hidden');
    document.getElementById('authBox').classList.remove('hidden');
    document.getElementById('loadingBox').classList.add('hidden');
  }
}
